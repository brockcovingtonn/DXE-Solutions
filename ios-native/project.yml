name: DXESolutions
options:
  bundleIdPrefix: com.dxesolutions
  deploymentTarget:
    iOS: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  DXESolutions:
    type: application
    platform: iOS
    sources:
      - path: DXESolutions/Sources
      - path: DXESolutions/Resources/Assets.xcassets
    info:
      path: DXESolutions/Resources/Info.plist
      properties:
        CFBundleDisplayName: DXE Solutions
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: DXE Solutions uses your camera to capture progress photos and scan documents for your projects.
        NSFaceIDUsageDescription: DXE Solutions uses Face ID to quickly and securely unlock the app.
        NSCalendarsUsageDescription: DXE Solutions adds project events to your calendar when you tap "Add to Calendar".
        NSCalendarsFullAccessUsageDescription: DXE Solutions adds project events to your calendar when you tap "Add to Calendar".
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DXESolutions/Resources/DXESolutions.entitlements
      properties:
        aps-environment: development
    scheme:
      shared: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dxesolutions.native
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JNQ2U9HTA3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: Supabase
        product: Supabase
